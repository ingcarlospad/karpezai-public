name: Public KarpezVoz sample

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  voice-detector:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify published source fingerprint
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('examples/karpezvoz')
          recorded = json.loads((root / 'PROVENANCE.json').read_text())['sha256']
          assert hashlib.sha256((root / 'turns.py').read_bytes()).hexdigest() == recorded
          print('Published source fingerprint matches provenance record')
          PY
      - name: Run real detector with synthetic input
        run: python examples/karpezvoz/demo.py
      - name: Run public behavior tests
        run: python -m unittest discover -s examples/karpezvoz/tests -v
